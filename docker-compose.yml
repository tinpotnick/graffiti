services:
  frontend-dev:
    image: node:20-bookworm
    working_dir: /app
    command: >
      bash -lc "
      corepack enable &&
      pnpm config set store-dir /pnpm/store &&
      pnpm install --no-frozen-lockfile &&
      pnpm dev --host 0.0.0.0 --port 1420
      "
    ports:
      - "1420:1420"
    volumes:
      - .:/app:z
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store

  frontend-check:
    image: node:20-bookworm
    working_dir: /app
    command: >
      bash -lc "
      corepack enable &&
      pnpm config set store-dir /pnpm/store &&
      pnpm install --no-frozen-lockfile &&
      pnpm run check
      "
    volumes:
      - .:/app:z
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store

  frontend-build:
    image: node:20-bookworm
    working_dir: /app
    command: >
      bash -lc "
      corepack enable &&
      pnpm config set store-dir /pnpm/store &&
      pnpm install --no-frozen-lockfile &&
      pnpm run build
      "
    volumes:
      - .:/app:z
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store

  # ── Tauri binary build ────────────────────────────────────────────────────
  # Compiles the Rust binary inside Docker (no display needed).
  # Output: .docker-cache/tauri_target/debug/graffiti — run this on the host.
  # Use via: ./scripts/tauri-dev.sh
  tauri-build:
    build:
      context: .
      dockerfile: Dockerfile.tauri
    working_dir: /app
    command: cargo build --manifest-path src-tauri/Cargo.toml
    environment:
      - CARGO_HOME=/home/cargo
    volumes:
      - .:/app:z
      # Cargo package cache — persists between builds to avoid re-downloading.
      - ./.docker-cache/cargo:/home/cargo:z
      # Build artefacts — bind-mounted so the binary is accessible on the host.
      - ./.docker-cache/tauri_target:/app/src-tauri/target:z

  # ── Local IPFS node (dev/test only) ──────────────────────────────────────────
  # Not required to run the app. Use for inspecting published CIDs and system tests.
  # CLI: docker compose exec ipfs-dev ipfs cat <cid>
  ipfs-dev:
    image: ipfs/kubo:v0.33.0
    ports:
      - "5001:5001"   # API
      - "8080:8080"   # Gateway
      - "4001:4001"   # Swarm
    volumes:
      - ipfs-dev-data:/data/ipfs

volumes:
  node_modules:
  pnpm_store:
  ipfs-dev-data:
