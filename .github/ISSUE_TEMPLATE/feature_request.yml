name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How might it work? Sketches and mockups are welcome.
  - type: checkboxes
    id: format
    attributes:
      label: Data format
      options:
        - label: This would change the published manifest / IPFS data format
