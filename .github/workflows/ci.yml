name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Type check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type check
        run: docker compose run --rm frontend-check
      - name: Production build
        run: docker compose run --rm frontend-build

  tauri:
    name: Tauri (Rust) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            .docker-cache/cargo
            .docker-cache/tauri_target
          key: tauri-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: tauri-${{ runner.os }}-
      - name: Build
        run: |
          mkdir -p .docker-cache/cargo .docker-cache/tauri_target
          docker compose run --rm tauri-build
